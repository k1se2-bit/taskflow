name: Firestore rules checks

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-rules-checks.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-rules-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: security-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Test local Firestore rules
        run: npm test
